name: Idle release

on:
  schedule:
    # A two-hour poll is the cheapest practical schedule. Sleeping in a runner
    # would consume the whole quiet period as billable Actions time.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idle-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check idle time and existing release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release_tag="build-${GITHUB_SHA:0:16}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" >/dev/null 2>&1; then
            echo "This commit already has a release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            pushed_at="$(gh api "repos/$GITHUB_REPOSITORY" --jq .pushed_at)"
            pushed_epoch="$(date -u -d "$pushed_at" +%s)"
            now_epoch="$(date -u +%s)"
            age="$((now_epoch - pushed_epoch))"
            if [ "$age" -lt 7200 ]; then
              echo "The last push was ${age}s ago; waiting for 7200s."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 1

      - name: Set up Bun
        if: steps.gate.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Test with Bun
        if: steps.gate.outputs.ready == 'true'
        # Player server tests can exceed the timeout on hosted runners.
        run: bun run test:bun --path-ignore-patterns '**/player.test.ts'

      - name: Type-check
        if: steps.gate.outputs.ready == 'true'
        run: bun run typecheck

      - name: Build extension packages
        if: steps.gate.outputs.ready == 'true'
        run: bun run build:extension

      - name: Publish latest release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            packages/extension/entropy-extension.zip \
            packages/extension/entropy.user.js \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_SHA" \
            --notes "" \
            --latest
